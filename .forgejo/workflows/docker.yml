# Build & publish Docker image
# Converted from .gitlab-ci.yml (build / deploy_tag / deploy_latest /
# deploy_schedule_tag). Pushes to the Forgejo container registry only —
# publishing to Docker Hub is a separate manual workflow (dockerhub.yml) that
# retags an image built here.
#
# The Forgejo runner has no in-job Docker CLI, but the host Docker socket is
# auto-mounted into job containers. So the job runs in the `docker:cli` image
# (which ships the docker client) and talks to that daemon directly — the
# equivalent of GitLab's docker:dind setup. Node is apk-installed first because
# Forgejo executes JS actions (checkout) with node inside the job container.
name: Docker

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Extra tag to publish to the Forgejo registry (replaces GitLab scheduled CUSTOM_TAG)"
        required: true

# Cancel an in-progress run when a newer commit is pushed to the same ref.
# (Tags are unique refs, so tag/release runs are never cancelled.)
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Only repo read is needed here. Pushing to the Forgejo container registry does
# NOT go through this token: Forgejo's automatic GITHUB_TOKEN cannot authenticate
# against the package registry at all (it fails with `unauthorized:
# reqPackageAccess` regardless of `packages: write` — see forgejo/forgejo#3571).
# The registry login below uses a Personal Access Token instead.
permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY || 'forge.vinid223.ca' }}
  # Forgejo registry image, e.g. forge.vinid223.ca/vinid223/gcloudstorage-docker
  IMAGE: ${{ vars.REGISTRY || 'forge.vinid223.ca' }}/${{ github.repository }}

jobs:
  build:
    runs-on: linux-amd64
    container:
      image: docker:cli
    env:
      DOCKER_BUILDKIT: "1"  # faster, cache-friendly builds (host daemon keeps a layer cache)
    # The image downloads the ~150 MB Google Cloud CLI and installs it; on a
    # slow runner this can take a while, so give the job plenty of room.
    timeout-minutes: 60
    steps:
      - name: Bootstrap node (checkout is a JS action)
        run: apk add --no-cache nodejs

      - uses: actions/checkout@v6

      # Build once, tagged with the commit sha. Publish steps below retag it.
      # The `revision` label stamps the source commit into the image so the
      # Docker Hub workflow can tell which commit the `:latest` image it pulls
      # was built from, and cut the release against that exact commit.
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${{ github.sha }}" .

      # Scan the locally-built image for vulnerabilities. Non-blocking
      # (--exit-code 0) — flip to 1 to fail the build on HIGH/CRITICAL findings.
      - name: Scan image for vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 0 \
            "${IMAGE}:${{ github.sha }}"

      # ---- publish steps ----
      # Every event pushes to the Forgejo registry, so log in on all events
      # (pull requests now publish a pr-<number> tag; see below).
      #
      # Auth uses a Personal Access Token (scope `write:package`), NOT the
      # automatic GITHUB_TOKEN — that one is rejected by the package registry.
      # REGISTRY_USERNAME must be the user that owns the PAT (defaults to the
      # repo owner); github.actor would be wrong for pushes by other users.
      - name: Log in to Forgejo registry
        run: |
          if [ -z "${{ secrets.REGISTRY_TOKEN }}" ]; then
            echo "::error::Secret REGISTRY_TOKEN is not set. Create a Forgejo Personal Access Token with the 'write:package' scope (Settings -> Applications) and add it as the repository secret REGISTRY_TOKEN."
            exit 1
          fi
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "${REGISTRY}" \
                -u "${{ secrets.REGISTRY_USERNAME || github.repository_owner }}" \
                --password-stdin

      # On a pull request, publish a throwaway :pr-<number> tag so the built
      # image can be pulled/tested for that PR. Overwritten on each new push.
      - name: Push :pr-<number> to Forgejo registry (pull request)
        if: github.event_name == 'pull_request'
        run: |
          pr="pr-${{ github.event.number }}"
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:${pr}"
          docker push "${IMAGE}:${pr}"

      - name: Push :<sha> to Forgejo registry
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE}:${{ github.sha }}"

      # deploy_latest: every push to master moves :latest. This is the single
      # source the Docker Hub workflow publishes from — it takes no inputs, it
      # always ships `:latest` — so master HEAD must always be what :latest is.
      - name: Push :latest (push to master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      # deploy_tag (GitLab `only: tags`): publish :<tag>. It does NOT touch
      # :latest — master owns that, and release tags are created by the Docker
      # Hub workflow *after* it has already shipped the current :latest.
      - name: Publish tag (on git tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ref="${{ github.ref_name }}"
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:${ref}"
          docker push "${IMAGE}:${ref}"

      # deploy_schedule_tag (GitLab `$CUSTOM_TAG`): manual run with a custom tag.
      - name: Publish custom tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          ct="${{ inputs.custom_tag }}"
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:${ct}"
          docker push "${IMAGE}:${ct}"
