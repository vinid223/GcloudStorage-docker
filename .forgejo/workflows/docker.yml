# Build & publish Docker image
# Converted from .gitlab-ci.yml (build / deploy_tag / deploy_latest /
# deploy_schedule_tag). Pushes to the Forgejo container registry only —
# publishing to Docker Hub is a separate manual workflow (dockerhub.yml) that
# retags an image built here.
#
# The Forgejo runner has no in-job Docker CLI, but the host Docker socket is
# auto-mounted into job containers. So the job runs in the `docker:cli` image
# (which ships the docker client) and talks to that daemon directly — the
# equivalent of GitLab's docker:dind setup. Node is apk-installed first because
# Forgejo executes JS actions (checkout) with node inside the job container.
name: Docker

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Extra tag to publish to the Forgejo registry (replaces GitLab scheduled CUSTOM_TAG)"
        required: true

# Cancel an in-progress run when a newer commit is pushed to the same ref.
# (Tags are unique refs, so tag/release runs are never cancelled.)
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Only repo read is needed here. Pushing to the Forgejo container registry does
# NOT go through this token: Forgejo's automatic GITHUB_TOKEN cannot authenticate
# against the package registry at all (it fails with `unauthorized:
# reqPackageAccess` regardless of `packages: write` — see forgejo/forgejo#3571).
# The registry login below uses a Personal Access Token instead.
permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY || 'forge.vinid223.ca' }}
  # Forgejo registry image, e.g. forge.vinid223.ca/vinid223/gcloudstorage-docker
  IMAGE: ${{ vars.REGISTRY || 'forge.vinid223.ca' }}/${{ github.repository }}
  # Architectures to publish. Defaults to amd64 only, which is what the runner
  # builds natively; see "Publishing arm64" in .forgejo/workflows/README.md
  # before setting the PLATFORMS variable to anything wider.
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64' }}

jobs:
  # Cheap checks first, so an obvious mistake fails in seconds instead of after
  # the ~150 MB CLI download. Both linters read the file from stdin: a path
  # inside this job container means nothing to the host Docker daemon the socket
  # points at, so bind-mounting the workspace would hand them an empty directory.
  lint:
    runs-on: linux-amd64
    container:
      image: docker:cli
    timeout-minutes: 10
    steps:
      - name: Bootstrap node (checkout is a JS action)
        run: apk add --no-cache nodejs

      - uses: actions/checkout@v6

      # run.sh is POSIX sh (the image has no bash), so it is checked as such.
      - name: Lint shell scripts (shellcheck)
        run: |
          status=0
          for f in run.sh tests/smoke.sh; do
            echo "--- $f"
            docker run --rm -i koalaman/shellcheck:stable \
              --severity=warning -s sh - < "$f" || status=1
          done
          echo "--- tests/run-tests.sh (bash)"
          docker run --rm -i koalaman/shellcheck:stable \
            --severity=warning - < tests/run-tests.sh || status=1
          exit $status

      # Ignored rules, all deliberate:
      #   DL3048 - the AUTHOR label predates the OCI naming convention and is
      #            kept so existing tooling that reads it keeps working.
      #   DL3018 - pinning apk versions makes builds fail as soon as Alpine
      #            drops the exact version from its repository.
      #   DL4006 - the one pipe in the file already ends in the command whose
      #            status matters, and it is followed by an explicit || branch.
      - name: Lint Dockerfile (hadolint)
        run: |
          docker run --rm -i hadolint/hadolint hadolint \
            --ignore DL3048 --ignore DL3018 --ignore DL4006 \
            --failure-threshold warning - < Dockerfile

  build:
    needs: lint
    runs-on: linux-amd64
    container:
      image: docker:cli
    env:
      DOCKER_BUILDKIT: "1"  # faster, cache-friendly builds (host daemon keeps a layer cache)
    # The image downloads the ~150 MB Google Cloud CLI and installs it; on a
    # slow runner this can take a while, so give the job plenty of room.
    timeout-minutes: 60
    steps:
      - name: Bootstrap node (checkout is a JS action)
        run: apk add --no-cache nodejs

      - uses: actions/checkout@v6

      # Build once, tagged with the commit sha. Publish steps below retag it.
      # The `revision` label stamps the source commit into the image so the
      # Docker Hub workflow can tell which commit the `:latest` image it pulls
      # was built from, and cut the release against that exact commit.
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${{ github.sha }}" .

      # Exercise the image before anything is published. These cases cover the
      # GCSOPTIONS translation table, the configuration checks, the lock, the log
      # and the healthcheck, all against a stub `gcloud` that reports the exact
      # command run.sh built — so a wrong flag or a swallowed exit status fails
      # here rather than silently on somebody's backup schedule.
      #
      # tests/run-tests.sh (the fake-gcs-server end-to-end suite) is not run
      # here: it bind-mounts host directories, which a job container driving the
      # host daemon through a socket cannot do. Run it locally instead.
      - name: Run smoke tests
        env:
          IMAGE_UNDER_TEST: ${{ env.IMAGE }}:${{ github.sha }}
        run: IMAGE="$IMAGE_UNDER_TEST" sh tests/smoke.sh

      # Scan the locally-built image for vulnerabilities. Non-blocking
      # (--exit-code 0) — flip to 1 to fail the build on HIGH/CRITICAL findings.
      - name: Scan image for vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 0 \
            "${IMAGE}:${{ github.sha }}"

      # ---- publish steps ----
      # Every event pushes to the Forgejo registry, so log in on all events
      # (pull requests now publish a pr-<number> tag; see below).
      #
      # Auth uses a Personal Access Token (scope `write:package`), NOT the
      # automatic GITHUB_TOKEN — that one is rejected by the package registry.
      # REGISTRY_USERNAME must be the user that owns the PAT (defaults to the
      # repo owner); github.actor would be wrong for pushes by other users.
      - name: Log in to Forgejo registry
        run: |
          if [ -z "${{ secrets.REGISTRY_TOKEN }}" ]; then
            echo "::error::Secret REGISTRY_TOKEN is not set. Create a Forgejo Personal Access Token with the 'write:package' scope (Settings -> Applications) and add it as the repository secret REGISTRY_TOKEN."
            exit 1
          fi
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "${REGISTRY}" \
                -u "${{ secrets.REGISTRY_USERNAME || github.repository_owner }}" \
                --password-stdin

      # Which tags this event publishes, decided in one place so the two publish
      # paths below cannot disagree:
      #   pull request     -> :pr-<number>, a throwaway tag for testing that PR's
      #                       image, overwritten on each new push. No :<sha>.
      #   push to master   -> :<sha> and :latest. :latest is the single source the
      #                       Docker Hub workflow publishes from, so master HEAD
      #                       must always be what :latest is.
      #   git tag          -> :<sha> and :<tag>. Deliberately NOT :latest — master
      #                       owns that, and release tags are created by the
      #                       Docker Hub workflow *after* it shipped that :latest.
      #   manual dispatch  -> :<sha> and the requested :<custom_tag>.
      - name: Decide which tags to publish
        run: |
          set -eu
          tags=""
          case "${{ github.event_name }}" in
            pull_request)
              tags="pr-${{ github.event.number }}"
              ;;
            workflow_dispatch)
              tags="${{ github.sha }} ${{ inputs.custom_tag }}"
              ;;
            *)
              tags="${{ github.sha }}"
              case "${{ github.ref }}" in
                refs/heads/master) tags="$tags latest" ;;
                refs/tags/*)       tags="$tags ${{ github.ref_name }}" ;;
              esac
              ;;
          esac
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "publishing: $tags"

      # Default path: retag and push the image that was just built, tested and
      # scanned, so exactly those bytes are what ships.
      - name: Push tags (single architecture)
        if: env.PLATFORMS == 'linux/amd64'
        run: |
          set -eu
          for t in $TAGS; do
            docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:${t}"
            docker push "${IMAGE}:${t}"
          done

      # Opt-in path, used only when the PLATFORMS variable asks for more than
      # amd64. A multi-architecture image cannot be loaded into the local image
      # store, so buildx builds and pushes it in one go; that means a second
      # build of amd64 (served from the layer cache) plus a build of every other
      # architecture. Read "Publishing arm64" in the workflows README first: the
      # runner needs binfmt/QEMU, and an emulated build of this image is slow
      # enough that the job timeout above usually has to go up.
      - name: Push tags (multi-architecture)
        if: env.PLATFORMS != 'linux/amd64'
        run: |
          set -eu
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --use --name multiarch --driver docker-container
          tag_args=""
          for t in $TAGS; do
            tag_args="$tag_args -t ${IMAGE}:${t}"
          done
          # shellcheck disable=SC2086
          docker buildx build \
            --platform "${PLATFORMS}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            $tag_args --push .
