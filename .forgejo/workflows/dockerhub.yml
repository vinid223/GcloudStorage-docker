# Release the current `:latest` image to Docker Hub — manual trigger, no inputs.
#
# docker.yml builds every push to master and moves `:latest` in the Forgejo
# registry. This workflow takes that image as-is (no rebuild, so what ships
# publicly is the byte-identical image CI built and Trivy scanned), works out the
# next version number itself, and then:
#
#   1. pushes it to Docker Hub as :<version> and :latest;
#   2. creates the git tag <version> in Forgejo, on the commit `:latest` was
#      built from (read back from the image's revision label);
#   3. creates a Forgejo release for that tag whose notes are the commits since
#      the previous version tag.
#
# It deliberately takes NO workflow inputs — the dispatch path used here cannot
# pass parameters. Everything is derived: source = `:latest`, version = previous
# highest version tag with the minor bumped (`V1.3` -> `V1.4.0`). Put `[major]`,
# `[minor]` or `[patch]` in the commit message to override that bump for a run.
name: Publish to Docker Hub

on:
  workflow_dispatch:

# Never cancel a publish in flight; queue instead. Two concurrent runs would
# race on the version number.
concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

# The release steps create the git tag and the release through the Forgejo API
# with the automatic per-run token, which already has repo write on this repo
# (unlike the package registry, the repo API accepts it). No `permissions:`
# block: Forgejo ignores it and uses Authorized Integrations instead.

env:
  REGISTRY: ${{ vars.REGISTRY || 'forge.vinid223.ca' }}
  IMAGE: ${{ vars.REGISTRY || 'forge.vinid223.ca' }}/${{ github.repository }}
  DOCKERHUB_IMAGE: vinid223/gcloud-storage-backup
  # Bump applied when the commit message carries no [major]/[minor]/[patch]
  # marker. Versions are normalized to 3 parts: V1.3 -> V1.4.0.
  DEFAULT_BUMP: minor

jobs:
  publish-dockerhub:
    runs-on: linux-amd64
    container:
      image: docker:cli
    timeout-minutes: 30
    env:
      # Token for the tags/releases API. The automatic GITHUB_TOKEN is enough
      # here; RELEASE_TOKEN (a PAT with repo write) is only needed if the
      # instance forbids run tokens from creating tags/releases.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      # docker:cli ships none of these: nodejs for the checkout JS action, git
      # for the tag list + changelog, curl/jq for the Forgejo API. Installed
      # before checkout — without git, the action silently falls back to a
      # tarball download and there would be no history or tags to read.
      - name: Bootstrap tooling
        run: apk add --no-cache nodejs git curl jq

      # Full history + all tags: needed to pick the previous version and diff
      # against it.
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          # fetch-depth: 0 normally brings tags along; make sure of it, since
          # the whole version calculation depends on them.
          git fetch --tags --force || echo "::warning::git fetch --tags failed; using the tags checkout provided."

      # Reading from the Forgejo registry uses the same PAT as docker.yml; the
      # automatic GITHUB_TOKEN cannot authenticate against the package registry
      # (see forgejo/forgejo#3571).
      - name: Log in to Forgejo registry
        run: |
          if [ -z "${{ secrets.REGISTRY_TOKEN }}" ]; then
            echo "::error::Secret REGISTRY_TOKEN is not set. Create a Forgejo Personal Access Token with the 'write:package' scope (Settings -> Applications) and add it as the repository secret REGISTRY_TOKEN."
            exit 1
          fi
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "${REGISTRY}" \
                -u "${{ secrets.REGISTRY_USERNAME || github.repository_owner }}" \
                --password-stdin

      # The source is always :latest — i.e. the last successful master build.
      - name: Pull :latest from the Forgejo registry
        run: |
          set -eu
          echo "Pulling ${IMAGE}:latest"
          docker pull "${IMAGE}:latest" || {
            echo "::error::${IMAGE}:latest not found in the Forgejo registry. It is published by the Docker workflow on every push to master — make sure that ran successfully at least once."
            exit 1
          }

      # Tag and release the commit the *image* came from, not whatever HEAD
      # happens to be now: the label is stamped in at build time by docker.yml.
      # Older images (built before the label existed) fall back to HEAD.
      - name: Resolve source commit
        run: |
          set -eu
          sha=$(docker image inspect \
                  --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                  "${IMAGE}:latest" 2>/dev/null || true)
          if [ -z "$sha" ] || [ "$sha" = "<no value>" ] || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "::warning:::latest carries no usable org.opencontainers.image.revision label (${sha:-unset}); falling back to ${GITHUB_SHA}."
            sha="${GITHUB_SHA}"
          fi
          echo "SOURCE_SHA=${sha}" >> "$GITHUB_ENV"
          echo "Source commit: ${sha} ($(git log -1 --pretty='%s' "$sha"))"

      # Next version = highest existing version tag, minor-bumped by default.
      # Tag names may be V-prefixed or not, 2- or 3-part (V1.3, V1.2.0, 1.1.7);
      # all are normalized to major.minor.patch for comparison, and the tag we
      # create is always V<major>.<minor>.<patch>.
      - name: Compute next version
        run: |
          set -eu

          best=0
          prev_tag=""
          prev_ver=""
          for t in $(git tag -l); do
            v="$t"
            case "$v" in [Vv]*) v="${v#?}" ;; esac
            printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || continue
            maj="${v%%.*}"
            rest="${v#*.}"
            min="${rest%%.*}"
            case "$rest" in *.*) pat="${rest#*.}" ;; *) pat=0 ;; esac
            # Zero-padded so plain integer comparison orders versions correctly.
            key=$(printf '%d%05d%05d' "$maj" "$min" "$pat")
            if [ "$key" -gt "$best" ]; then
              best="$key"
              prev_tag="$t"
              prev_ver="${maj}.${min}.${pat}"
            fi
          done

          if [ -z "$prev_tag" ]; then
            echo "No version tag found — starting at V1.0.0."
            version="V1.0.0"
          else
            maj="${prev_ver%%.*}"
            rest="${prev_ver#*.}"
            min="${rest%%.*}"
            pat="${rest#*.}"

            # A [major]/[minor]/[patch] marker in the source commit message
            # overrides DEFAULT_BUMP for this run (no workflow inputs needed).
            bump="${DEFAULT_BUMP}"
            msg=$(git log -1 --pretty='%B' "${SOURCE_SHA}")
            case "$msg" in
              *'[major]'*|*'[MAJOR]'*) bump=major ;;
              *'[minor]'*|*'[MINOR]'*) bump=minor ;;
              *'[patch]'*|*'[PATCH]'*) bump=patch ;;
            esac

            case "$bump" in
              major) maj=$((maj + 1)); min=0; pat=0 ;;
              minor) min=$((min + 1)); pat=0 ;;
              patch) pat=$((pat + 1)) ;;
              *) echo "::error::DEFAULT_BUMP must be major, minor or patch (got '${bump}')."; exit 1 ;;
            esac
            echo "Previous version: ${prev_tag} (${prev_ver}), bump: ${bump}"
            version="V${maj}.${min}.${pat}"
          fi

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "::error::Computed version ${version} already exists as a git tag. Refusing to overwrite it."
            exit 1
          fi

          echo "PREV_TAG=${prev_tag}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "Next version: ${version}"

      - name: Build release notes (changes since the previous version)
        run: |
          set -eu
          if [ -n "${PREV_TAG}" ]; then
            range="${PREV_TAG}..${SOURCE_SHA}"
          else
            echo "No previous version tag — listing the full history."
            range="${SOURCE_SHA}"
          fi

          git log --no-merges --reverse --pretty='- %s (%h)' "$range" > /tmp/commits.md
          if [ ! -s /tmp/commits.md ]; then
            echo "::warning::No commits between ${PREV_TAG:-the start of history} and ${SOURCE_SHA} — releasing ${VERSION} with an empty changelog."
            echo "- No changes." > /tmp/commits.md
          fi

          {
            if [ -n "${PREV_TAG}" ]; then
              echo "## Changes since ${PREV_TAG}"
            else
              echo "## Changes"
            fi
            echo
            cat /tmp/commits.md
            echo
            echo "Docker image: \`${DOCKERHUB_IMAGE}:${VERSION}\` (also tagged \`latest\`, published from \`${IMAGE}:latest\` built at \`${SOURCE_SHA}\`)"
            if [ -n "${PREV_TAG}" ]; then
              echo
              echo "[Full diff](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${VERSION})"
            fi
          } > /tmp/release-notes.md

          echo "---- release notes ----"
          cat /tmp/release-notes.md

      - name: Log in to Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKER_HUB_PASSWORD }}" ]; then
            echo "::error::Secrets DOCKER_HUB_USERNAME / DOCKER_HUB_PASSWORD are not set (a Docker Hub access token is recommended over a password)."
            exit 1
          fi
          echo "${{ secrets.DOCKER_HUB_PASSWORD }}" \
            | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Retag and push to Docker Hub
        run: |
          set -eu
          for tag in "${VERSION}" latest; do
            dst="${DOCKERHUB_IMAGE}:${tag}"
            echo "Publishing ${dst}"
            docker tag "${IMAGE}:latest" "${dst}"
            docker push "${dst}"
          done

      # ---- Forgejo tag + release ----
      # Runs last, so a release only ever exists for an image that actually made
      # it to Docker Hub.
      - name: Create tag and release in Forgejo
        run: |
          set -eu
          api="${GITHUB_API_URL:-${GITHUB_SERVER_URL}/api/v1}/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${RELEASE_TOKEN}"

          # Tolerate a tag that already exists (re-run after a failed release,
          # or it was pushed by hand between the version check and here).
          if curl -sf -o /dev/null -H "$auth" "${api}/tags/${VERSION}"; then
            echo "Tag ${VERSION} already exists — reusing it."
          else
            code=$(curl -s -o /tmp/tag.json -w '%{http_code}' -X POST \
              -H "$auth" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg t "${VERSION}" --arg s "${SOURCE_SHA}" '{tag_name:$t,target:$s}')" \
              "${api}/tags")
            if [ "$code" != "201" ]; then
              echo "::error::Creating tag ${VERSION} failed (HTTP ${code}): $(cat /tmp/tag.json)"
              exit 1
            fi
            echo "Created tag ${VERSION} at ${SOURCE_SHA}"
          fi

          payload=$(jq -n --arg t "${VERSION}" --arg s "${SOURCE_SHA}" \
            --rawfile body /tmp/release-notes.md \
            '{tag_name:$t,target_commitish:$s,name:$t,body:$body,draft:false,prerelease:false}')
          code=$(curl -s -o /tmp/release.json -w '%{http_code}' -X POST \
            -H "$auth" -H 'Content-Type: application/json' -d "$payload" "${api}/releases")
          case "$code" in
            201) echo "Released ${VERSION}: $(jq -r '.html_url // empty' /tmp/release.json)" ;;
            409) echo "::error::A release for ${VERSION} already exists — delete it before re-running."; exit 1 ;;
            *)   echo "::error::Creating release ${VERSION} failed (HTTP ${code}): $(cat /tmp/release.json)"; exit 1 ;;
          esac

      - name: Summary
        run: |
          echo "Published ${DOCKERHUB_IMAGE}:${VERSION} and ${DOCKERHUB_IMAGE}:latest"
          echo "from ${IMAGE}:latest (commit ${SOURCE_SHA}), released as ${VERSION} in Forgejo."
